apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- $api := printf "api.%s.sslip.io" .Values.global.sslipIp }}
  {{- if .Values.global.useCustomHosts }}
  {{- $api = required "global.apiHost is required for custom hosts" .Values.global.apiHost }}
  {{- end }}
  # Switched only after branded ingress certificates are ready. The entrypoint
  # templates this public URL into window.__APP_CONFIG__.
  API_BASE_URL: {{ printf "https://%s" $api | quote }}
