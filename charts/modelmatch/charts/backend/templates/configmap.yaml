apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- $legacyApp := printf "app.%s.sslip.io" .Values.global.sslipIp }}
  {{- $legacyApi := printf "api.%s.sslip.io" .Values.global.sslipIp }}
  {{- $api := $legacyApi }}
  {{- if .Values.global.useCustomHosts }}
  {{- $api = required "global.apiHost is required for custom hosts" .Values.global.apiHost }}
  {{- end }}
  {{- $origins := list }}
  {{- if or (not .Values.global.useCustomHosts) .Values.global.retainSslipHosts }}
  {{- $origins = append $origins (printf "https://%s" $legacyApp) }}
  {{- end }}
  {{- if .Values.global.appHost }}
  {{- $origins = append $origins (printf "https://%s" .Values.global.appHost) }}
  {{- end }}
  # Stage ingress/TLS first, then switch the public API URL. Accept both app origins
  # during the transition so existing browser sessions continue to work.
  PUBLIC_BASE_URL: {{ printf "https://%s" $api | quote }}
  CORS_ALLOW_ORIGINS: {{ $origins | uniq | join "," | quote }}
