{{- if .Values.ingress.enabled }}
{{- /*
P15 — routing through P11's one F5 NGINX ingress ELB (never creates a LoadBalancer).
Host-based: app.<ip>.sslip.io -> frontend, api.<ip>.sslip.io -> backend (FastAPI at
ROOT — no /api prefix, no rewrite). Custom hosts are added alongside sslip.io hosts
for certificate provisioning before the runtime URL switch.

F5 MERGEABLE INGRESS (master/minion). F5 will not merge a second Ingress onto a host
the app already owns, and cert-manager's HTTP-01 solver IS a second Ingress on the same
host. So per host we render:
  - a MASTER (nginx.org/mergeable-ingress-type=master): host + TLS + the cert-manager
    cluster-issuer annotation, and NO http paths (F5's master rule);
  - a MINION (mergeable-ingress-type=minion): the actual "/" route.
cert-manager's solver Ingress joins as ANOTHER minion (annotated via the ClusterIssuer's
http01 ingressTemplate) so F5 merges its /.well-known/acme-challenge path into the host.
ssl-redirect stays off; the controller's shared config redirects HTTP except the HTTP-01
challenge path. TLS is per host: each master owns its own single-SAN
Certificate/Secret (two masters cannot share one secret).
*/}}
{{- $ip := required "global.sslipIp must be set" .Values.global.sslipIp -}}
{{- if and .Values.global.appHost (or
  (eq .Values.global.appHost .Values.global.apiHost)
  (eq .Values.global.appHost (printf "app.%s.sslip.io" $ip))
  (eq .Values.global.appHost (printf "api.%s.sslip.io" $ip))
  (eq .Values.global.apiHost (printf "app.%s.sslip.io" $ip))
  (eq .Values.global.apiHost (printf "api.%s.sslip.io" $ip))) -}}
{{- fail "Custom app/API hosts must be distinct from each other and the legacy hosts" -}}
{{- end -}}
{{- $hosts := list -}}
{{- if .Values.global.retainSslipHosts -}}
{{- $hosts = list
      (dict "role" "app" "host" (printf "app.%s.sslip.io" $ip) "svc" .Values.ingress.app.service "port" .Values.ingress.app.port "tls" .Values.ingress.app.tlsSecretName)
      (dict "role" "api" "host" (printf "api.%s.sslip.io" $ip) "svc" .Values.ingress.api.service "port" .Values.ingress.api.port "tls" .Values.ingress.api.tlsSecretName) -}}
{{- end -}}
{{- if and .Values.global.appHost .Values.global.apiHost -}}
{{- $hosts = concat $hosts (list
      (dict "role" "app-branded" "host" .Values.global.appHost "svc" .Values.ingress.app.service "port" .Values.ingress.app.port "tls" (printf "%s-branded" .Values.ingress.app.tlsSecretName))
      (dict "role" "api-branded" "host" .Values.global.apiHost "svc" .Values.ingress.api.service "port" .Values.ingress.api.port "tls" (printf "%s-branded" .Values.ingress.api.tlsSecretName))) -}}
{{- end -}}
{{- range $name, $pair := .Values.global.additionalHosts -}}
{{- if $pair.enabled -}}
{{- $hosts = concat $hosts (list
      (dict "role" (printf "app-%s" $name) "host" $pair.appHost "svc" $.Values.ingress.app.service "port" $.Values.ingress.app.port "tls" (printf "%s-%s" $.Values.ingress.app.tlsSecretName $name))
      (dict "role" (printf "api-%s" $name) "host" $pair.apiHost "svc" $.Values.ingress.api.service "port" $.Values.ingress.api.port "tls" (printf "%s-%s" $.Values.ingress.api.tlsSecretName $name))) -}}
{{- end -}}
{{- end -}}
{{- $seen := dict -}}
{{- range $h := $hosts -}}
{{- if hasKey $seen $h.host -}}{{ fail "All public app/API hosts must be distinct" }}{{- end -}}
{{- $_ := set $seen $h.host true -}}
{{- end -}}
{{- range $h := $hosts }}
---
# {{ $h.role }} host — MASTER: host + TLS + cert-manager; NO http paths (F5 master rule).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modelmatch-{{ $h.role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: modelmatch
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: modelmatch
    app.kubernetes.io/component: ingress-master
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    nginx.org/mergeable-ingress-type: "master"
    # F5 force-redirects HTTP->HTTPS when TLS is set; must be off for HTTP-01 + renewals.
    # Canonical F5 key (the controller's SSLRedirectAnnotation const); the legacy
    # ingress.kubernetes.io/ssl-redirect is only a compat fallback.
    nginx.org/ssl-redirect: {{ $.Values.ingress.sslRedirect | quote }}
    # ingress-shim issues/renews the cert for tls.hosts via this ClusterIssuer.
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: {{ $.Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ $h.host | quote }}
      secretName: {{ $h.tls | quote }}
  rules:
    # Host only — a master carries no http paths (the minions provide them).
    - host: {{ $h.host | quote }}
---
# {{ $h.role }} host — MINION: the "/" route, merged into the master by F5.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modelmatch-{{ $h.role }}-routes
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: modelmatch
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: modelmatch
    app.kubernetes.io/component: ingress-minion
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    {{- if $.Values.ingress.protection.enabled }}
    nginx.org/limit-req-rate: {{ ternary $.Values.ingress.protection.apiRate $.Values.ingress.protection.appRate (hasPrefix "api" $h.role) | quote }}
    nginx.org/limit-req-burst: {{ ternary $.Values.ingress.protection.apiBurst $.Values.ingress.protection.appBurst (hasPrefix "api" $h.role) | quote }}
    nginx.org/limit-req-no-delay: "true"
    nginx.org/limit-req-reject-code: "429"
    nginx.org/client-max-body-size: {{ $.Values.ingress.protection.bodySize | quote }}
    nginx.org/proxy-connect-timeout: "5s"
    nginx.org/proxy-read-timeout: "60s"
    nginx.org/proxy-send-timeout: "30s"
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className | quote }}
  rules:
    - host: {{ $h.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $h.svc | quote }}
                port:
                  number: {{ $h.port }}
{{- if and $.Values.ingress.protection.enabled (hasPrefix "api" $h.role) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modelmatch-{{ $h.role }}-auth
  namespace: {{ $.Release.Namespace }}
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/limit-req-rate: {{ $.Values.ingress.protection.authRate | quote }}
    nginx.org/limit-req-burst: {{ $.Values.ingress.protection.authBurst | quote }}
    nginx.org/limit-req-no-delay: "true"
    nginx.org/limit-req-reject-code: "429"
    nginx.org/client-max-body-size: {{ $.Values.ingress.protection.authBodySize | quote }}
    nginx.org/proxy-connect-timeout: "5s"
    nginx.org/proxy-read-timeout: "15s"
    nginx.org/proxy-send-timeout: "15s"
spec:
  ingressClassName: {{ $.Values.ingress.className | quote }}
  rules:
    - host: {{ $h.host | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ $h.svc | quote }}
                port:
                  number: {{ $h.port }}
{{- end }}
{{- end }}
{{- end }}
